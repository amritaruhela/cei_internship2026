name: DataTrust CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-data-engine:
    name: Test Data Engine & Monitoring Pipelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data-engine/requirements.txt
          pip install -r backend/requirements.txt

      - name: Run Data Engine Unit Tests
        run: |
          pytest data-engine/tests/ --verbose

      - name: Run End-to-End Pipeline Demo Test
        run: |
          python scripts/run_demo.py --scenario healthy

  lint-and-build-frontend:
    name: Lint & Build Frontend Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React Dashboard
        run: |
          cd frontend
          npm run build
