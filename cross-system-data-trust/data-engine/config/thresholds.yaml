# Drift Detection Thresholds Configuration

volume_drift:
  # Rolling baseline window in days
  baseline_window_days: 30
  # Z-score threshold for anomaly detection
  z_score_threshold: 2.5
  thresholds:
    critical: 0.40   # >40% change
    high: 0.20       # >20% change
    medium: 0.10     # >10% change
    low: 0.05        # >5% change

distribution_drift:
  # PSI thresholds (Population Stability Index)
  psi_thresholds:
    critical: 0.25   # Major shift
    high: 0.20       # Significant shift
    medium: 0.10     # Minor shift
    low: 0.05        # Slight shift
  # KS test p-value threshold
  ks_pvalue_threshold: 0.05
  # Categorical chi-square p-value threshold
  chi2_pvalue_threshold: 0.05
  # Minimum sample size for statistical tests
  min_sample_size: 30
  # Number of bins for PSI calculation
  psi_bins: 10

schema_drift:
  # Auto-detect renamed columns if Levenshtein distance <= this value
  rename_detection_threshold: 2
  # Track nullable changes
  track_nullable: true
  # Track data type changes
  track_type_changes: true

freshness:
  sources:
    billing:
      expected_frequency_hours: 24
      warning_delay_hours: 30
      critical_delay_hours: 48
    analytics:
      expected_frequency_hours: 24
      warning_delay_hours: 26
      critical_delay_hours: 48
    crm:
      expected_frequency_hours: 168  # weekly
      warning_delay_hours: 192
      critical_delay_hours: 240

trust_score:
  weights:
    completeness: 0.20
    consistency: 0.25
    accuracy: 0.20
    freshness: 0.15
    uniqueness: 0.10
    drift_stability: 0.10
  # Minimum score to be considered "healthy"
  healthy_threshold: 85
  warning_threshold: 70
  critical_threshold: 50

severity_engine:
  # Global severity overrides by rule type
  completeness:
    critical_rate: 0.80   # <80% complete = CRITICAL
    high_rate: 0.90       # <90% = HIGH
    medium_rate: 0.95     # <95% = MEDIUM
    low_rate: 0.98        # <98% = LOW
  uniqueness:
    critical_rate: 0.95   # >5% duplicates = CRITICAL
    high_rate: 0.98
    medium_rate: 0.99
    low_rate: 0.999
